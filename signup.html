<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-auth="guest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAAC — إنشاء حساب</title>
  <meta name="description" content="أنشئ حساب جديد في MAAC للمحاسبة والمراجعة.">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- Applies the saved theme + the route guard before first paint (must stay a classic script) -->
  <script src="assets/js/boot.js"></script>

  <link rel="preload" href="assets/fonts/amiri-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="page-auth">
  <div class="auth">

    <!-- ===== Form side ===== -->
    <main class="auth__main" id="main">
      <header class="auth__top">
        <a class="auth__mark" href="login.html" aria-label="MAAC">
          <span class="logo-mark" aria-hidden="true"><span data-icon="trending-up" data-size="22"></span></span>
          <span class="auth__mark-name">MAAC</span>
        </a>
        <div class="theme-row" data-theme-row></div>
      </header>

      <section class="auth__card auth__card--wide" id="auth-card" aria-labelledby="auth-title">
        <div class="logo-mark" aria-hidden="true"><span data-icon="trending-up" data-size="36" data-stroke="2.25"></span></div>

        <h1 class="display auth__title" id="auth-title">إنشاء حساب جديد</h1>
        <p class="lead auth__lead">املا بياناتك وهنبعتلك كود تأكيد على الإيميل.</p>

        <form class="auth__form" id="signup-form" novalidate>
          <div class="notice notice--danger" data-form-error role="alert" hidden>
            <span data-icon="circle-alert" data-size="18"></span>
            <span data-error-text></span>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field__label" for="firstName">الاسم الأول</label>
              <div class="input">
                <input class="input__control" id="firstName" name="firstName" type="text" autocomplete="given-name" placeholder="أحمد" aria-describedby="firstName-error">
              </div>
              <p class="field__error" id="firstName-error" role="alert" hidden>
                <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
              </p>
            </div>
            <div class="field">
              <label class="field__label" for="lastName">الاسم التاني</label>
              <div class="input">
                <input class="input__control" id="lastName" name="lastName" type="text" autocomplete="family-name" placeholder="محمود" aria-describedby="lastName-error">
              </div>
              <p class="field__error" id="lastName-error" role="alert" hidden>
                <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
              </p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="email">البريد الإلكتروني</label>
            <div class="input">
              <span class="input__icon" data-icon="mail" data-size="20"></span>
              <input class="input__control input__control--ltr" id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false"
                     placeholder="name@company.com" aria-describedby="email-error">
            </div>
            <p class="field__error" id="email-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
          </div>
          <div class="field">
            <label class="field__label" for="password">كلمة المرور</label>
            <div class="input">
              <span class="input__icon" data-icon="lock" data-size="20"></span>
              <input class="input__control input__control--ltr" id="password" name="password" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false"
                     placeholder="••••••••" aria-describedby="password-error password-help password-strength">
              <button type="button" class="input__action" data-toggle-password aria-label="إظهار كلمة المرور" aria-pressed="false">
                <span data-icon="eye" data-size="18"></span>
              </button>
            </div>
            <p class="field__error" id="password-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
            <p class="field__help" id="password-help">8 حروف أو أرقام على الأقل، ولازم فيها حرف ورقم.</p>
            <div class="strength" id="password-strength" data-strength="0" hidden aria-live="polite">
              <span class="strength__bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
              <span class="strength__label"></span>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="confirmPassword">تأكيد كلمة المرور</label>
            <div class="input">
              <span class="input__icon" data-icon="lock" data-size="20"></span>
              <input class="input__control input__control--ltr" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false"
                     placeholder="••••••••" aria-describedby="confirmPassword-error">
              <button type="button" class="input__action" data-toggle-password aria-label="إظهار كلمة المرور" aria-pressed="false">
                <span data-icon="eye" data-size="18"></span>
              </button>
            </div>
            <p class="field__error" id="confirmPassword-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
          </div>
          <div class="field">
            <label class="field__label" for="phone">رقم الهاتف</label>
            <div class="input">
              <span class="input__icon" data-icon="phone" data-size="20"></span>
              <input class="input__control input__control--ltr" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" autocapitalize="none" spellcheck="false"
                     placeholder="01012345678" aria-describedby="phone-error">
            </div>
            <p class="field__error" id="phone-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
          </div>
          <div class="field">
            <label class="field__label" for="jobTitle">الوظيفة</label>
            <div class="input">
              <span class="input__icon" data-icon="briefcase" data-size="20"></span>
              <input class="input__control" id="jobTitle" name="jobTitle" type="text" autocomplete="organization-title" autocapitalize="none" spellcheck="false"
                     placeholder="مثال: محاسب قانوني" aria-describedby="jobTitle-error">
            </div>
            <p class="field__error" id="jobTitle-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
          </div>
          <div class="field">
            <label class="field__label" for="company">اسم الشركة</label>
            <div class="input">
              <span class="input__icon" data-icon="building" data-size="20"></span>
              <input class="input__control" id="company" name="company" type="text" autocomplete="organization" autocapitalize="none" spellcheck="false"
                     placeholder="اسم الشركة أو المكتب" aria-describedby="company-error">
            </div>
            <p class="field__error" id="company-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
          </div>
          <div class="field">
            <label class="field__label" for="taxId">رقم التسجيل الضريبي</label>
            <div class="input">
              <span class="input__icon" data-icon="hash" data-size="20"></span>
              <input class="input__control input__control--ltr" id="taxId" name="taxId" type="text" inputmode="numeric" autocomplete="off" autocapitalize="none" spellcheck="false"
                     placeholder="123-456-789" aria-describedby="taxId-error taxId-help">
            </div>
            <p class="field__error" id="taxId-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
            <p class="field__help" id="taxId-help">9 أرقام — هتلاقيه على البطاقة الضريبية للشركة.</p>
          </div>

          <button class="btn btn--primary btn--lg btn--block" type="submit">
            <span class="is-spinning" data-icon="loader-circle" data-size="18" data-spinner hidden></span>
            <span data-label>تسجيل</span>
          </button>
        </form>

        <p class="auth__alt">عندك حساب بالفعل؟ <a href="login.html">سجّل دخول</a></p>
      </section>
    </main>

    <!-- ===== Brand panel (decorative, hidden on small screens) — rendered by components/auth-brand.js ===== -->
    <aside id="brand"></aside>

  </div>

  <script type="module" src="assets/js/pages/signup.page.js"></script>
</body>
</html>
