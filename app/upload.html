<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-auth="required" data-area="user">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إضافة ملفات — MAAC</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

  <script src="../assets/js/boot.js"></script>

  <link rel="preload" href="../assets/fonts/amiri-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="page-upload">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الجانبية"></aside>

    <main class="main" id="main">
      <div class="page page--md">
        <header class="page__header">
          <h1 class="display display--page">إضافة ملفات للداتا سيت</h1>
          <p class="lead page__subtitle">الملفات اللي بتضيفها بيتعلم منها المساعد ويجاوب منها.</p>
        </header>

        <!-- Drop area -->
        <section class="dropzone upload__dropzone" id="dropzone" aria-label="منطقة رفع الملفات">
          <div class="dropzone__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
          </div>
          <h2 class="dropzone__title">اسحب الملفات هنا أو اختارها من جهازك</h2>

          <div class="dropzone__types" aria-label="الأنواع المدعومة">
            <span class="file-badge file-badge--pdf">PDF</span>
            <span class="file-badge file-badge--word">Word</span>
            <span class="file-badge file-badge--excel">Excel</span>
            <span class="file-badge file-badge--image">صور</span>
          </div>

          <button type="button" class="btn btn--primary" id="pick-files">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            <span>اختيار ملفات</span>
          </button>
          <input class="dropzone__input" id="file-input" type="file" multiple hidden>
        </section>

        <!-- Added files -->
        <section class="card upload__files" aria-labelledby="files-title">
          <div class="card__head">
            <h2 class="card__title" id="files-title">الملفات المضافة</h2>
          </div>
          <table class="data-table files-table">
            <colgroup>
              <col style="width: 90px">
              <col>
              <col style="width: 182px">
              <col style="width: 64px">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">النوع</th>
                <th scope="col">اسم الملف</th>
                <th scope="col">الحالة</th>
                <th scope="col"><span class="sr-only">مسح</span></th>
              </tr>
            </thead>
            <tbody id="files-body"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="../assets/js/pages/upload.page.js"></script>
</body>
</html>
