<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-auth="required" data-area="admin">
<head>

  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">

  <!-- Applies the saved theme before first paint (must stay a classic script) -->

  <link rel="preload" href="../assets/fonts/amiri-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>

<body class="page-home">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الجانبية"></aside>

    <main class="main" id="main">

        <div class="home__composer" id="composer"></div>

        <div class="home__suggestions" id="suggestions" role="group" aria-label="أسئلة مقترحة">
          <button type="button" class="suggestion">ما هي قيمة بند 601؟</button>

        </div>
      </section>
    </main>
  </div>

  <script type="module" src="../assets/js/pages/home.page.js"></script>
