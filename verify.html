<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-auth="guest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAAC — تأكيد الإيميل</title>
  <meta name="description" content="ادخل كود التأكيد المكوّن من 6 أرقام اللي وصلك على الإيميل.">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- Applies the saved theme + the route guard before first paint (must stay a classic script) -->
  <script src="assets/js/boot.js"></script>

  <link rel="preload" href="assets/fonts/amiri-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body class="page-auth">
  <div class="auth">

    <!-- ===== Form side ===== -->
    <main class="auth__main" id="main">
      <header class="auth__top">
        <a class="auth__mark" href="login.html" aria-label="MAAC">
          <span class="logo-mark" aria-hidden="true"><span data-icon="trending-up" data-size="22"></span></span>
          <span class="auth__mark-name">MAAC</span>
        </a>
        <div class="theme-row" data-theme-row></div>
      </header>

      <section class="auth__card" id="auth-card" aria-labelledby="auth-title">
        <div class="logo-mark" aria-hidden="true"><span data-icon="mail-check" data-size="34"></span></div>

        <h1 class="display auth__title" id="auth-title">تأكد من الإيميل</h1>
        <p class="lead auth__lead">سوف يصل إليك كود من 6 أرقام على <bdi class="ltr auth__email" id="verify-email"></bdi> — ادخلهم في الخانات تحت.</p>

        <div class="notice auth__notice" id="page-notice" role="status" hidden>
          <span data-notice-icon></span>
          <span data-notice-text></span>
        </div>

        <form class="auth__form" id="verify-form" novalidate>
          <div class="field">
            <span class="field__label" id="otp-label">كود التأكيد</span>
            <div id="otp" aria-labelledby="otp-label"></div>
            <p class="field__error" id="otp-error" role="alert" hidden>
              <span data-icon="circle-alert" data-size="14"></span><span data-error-text></span>
            </p>
          </div>

          <button class="btn btn--primary btn--lg btn--block" type="submit">
            <span class="is-spinning" data-icon="loader-circle" data-size="18" data-spinner hidden></span>
            <span data-label>تأكيد</span>
          </button>
        </form>

        <p class="auth__resend">
          ماوصلكش الكود؟
          <button type="button" class="field__link" id="resend" disabled>إعادة الإرسال</button>
          <span class="auth__timer" id="resend-timer" aria-live="off"></span>
        </p>

        <p class="auth__alt"><a class="auth__back" id="back-link" href="signup.html"><span data-icon="arrow-right" data-size="16"></span><span id="back-label">تعديل البيانات</span></a></p>

        <!-- Demo code — a real server e-mails it. Delete this block when a real back-end is connected -->
        <div class="auth__demo">
          <div>
            <span class="auth__demo-title">كود تجريبي (مفيش إيميل بيتبعت فعلاً)</span>
            <span class="auth__demo-cred" id="demo-code"></span>
          </div>
          <button type="button" class="btn btn--outline btn--sm" id="fill-code">اكتبه</button>
        </div>
      </section>
    </main>

    <!-- ===== Brand panel (decorative, hidden on small screens) — rendered by components/auth-brand.js ===== -->
    <aside id="brand"></aside>

  </div>

  <script type="module" src="assets/js/pages/verify.page.js"></script>
</body>
</html>
